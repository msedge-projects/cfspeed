name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Build one archive per target. Kept separate from the release job so the four
  # matrix legs never race each other to write the same GitHub release.
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          # Stage first, then archive - writing the tarball into the directory
          # being tarred makes tar include and mutate its own output.
          rm -rf staging dist
          mkdir -p staging dist
          cp "target/${{ matrix.target }}/release/cfspeed" staging/
          cp README.md LICENSE staging/
          tar -czf "dist/cfspeed-${{ matrix.target }}.tar.gz" -C staging .

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force staging, dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path staging, dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/cfspeed.exe" staging/
          Copy-Item README.md, LICENSE staging/
          Compress-Archive -Path staging/* -DestinationPath "dist/cfspeed-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfspeed-${{ matrix.target }}
          path: dist/*

  # Single job publishes every archive in one pass.
  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksum everything
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z | xargs -0 sha256sum > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true