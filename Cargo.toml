[package]
name = "cfspeed"
version = "0.1.0"
edition = "2021"
description = "A high-quality TUI speed test against Cloudflare's public endpoints"
license = "MIT"

[dependencies]
anyhow = "1.0"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "rustls-tls-native-roots",
    "http2",
    "gzip",
    "json",
    "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1"
rand = "0.8"

# Real TLS handshake timing (cipher negotiation) for the diagnostics panel.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = "0.26"
rustls-native-certs = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
strip = true